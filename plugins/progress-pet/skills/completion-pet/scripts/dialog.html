const $=id=>document.getElementById(id);
let items=[],selected='',autoFollow=true,conversations=new Map(),drafts=new Map(),pending=new Map(),nextId=0,introTimer=null,departureTimer=null,entranceOrigin={},presentSequence=0,focusId='',focusTaskKey='',recommendationKey='',knownTasks=new Set(),approvalFocus=new Map(),composeMode='ask',controlBusy=new Set();
const native=!!window.webkit?.messageHandlers?.dog;
document.body.classList.add(native?'native':'preview');
window.presentMochi=function(origin={}){
 clearTimeout(introTimer);clearTimeout(departureTimer);presentSequence++;
 entranceOrigin=origin;document.body.classList.remove('dismissed','departing');document.body.classList.add('announcement');
 document.body.classList.toggle('tracking',origin.mode==='tracking');document.querySelector('.tracking-note').setAttribute('aria-hidden',String(origin.mode!=='tracking'));document.body.classList.add('intro');
 $('trackingText').textContent=origin.projectTitle?`I’m tracking the progress of “${origin.projectTitle}”.`:'I’m tracking the progress.';
 const dog=document.querySelector('.dog'),ground=document.querySelector('.ground');
 [dog,ground].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
 const rect=dog.getBoundingClientRect(),gr=ground.getBoundingClientRect();
 const x=(origin.x??rect.left+rect.width/2)-(rect.left+rect.width/2);
 const y=(origin.y??rect.top+rect.height*.92)-(rect.top+rect.height*.92);
 const gx=(origin.x??gr.left+gr.width/2)-(gr.left+gr.width/2),gy=(origin.y??gr.top)-(gr.top);
 const reduced=origin.reduceMotion||window.matchMedia('(prefers-reduced-motion:reduce)').matches;
 const announcement=origin.mode==='tracking';
 if(reduced){document.body.classList.remove('intro');return}
 ground.animate([{transform:`translate(${gx}px,${gy}px) scaleX(0)`,opacity:0,offset:0},{transform:`translate(${gx}px,${gy}px) scaleX(.65)`,opacity:1,offset:.19},{transform:'translate(0,0) scaleX(1)',opacity:1,offset:1}],{duration:announcement?260:1350,easing:'cubic-bezier(.23,.7,.25,1)'});
 dog.animate([
 {transform:`translate(${x}px,${y+12}px) scale(.03,.01) rotate(-18deg)`,opacity:0,offset:0},

 {transform:`translate(${x*.72}px,${y*.55-30}px) scale(.56,.72) rotate(-14deg)`,opacity:1,offset:.39},
 {transform:`translate(${x*.25}px,-32px) scale(.98,1.06) rotate(5deg)`,opacity:1,offset:.62},
 {transform:'translate(0,3px) scale(1.1,.89) rotate(-2deg)',opacity:1,offset:.83},
 {transform:'translate(0,-3px) scale(.98,1.025)',opacity:1,offset:.93},
 {transform:'translate(0,0) scale(1)',opacity:1,offset:1}

};
window.departMochi=function(){
 clearTimeout(introTimer);clearTimeout(departureTimer);document.body.classList.add('departing');
 const dog=document.querySelector('.dog'),ground=document.querySelector('.ground'),stage=document.querySelector('.stage').getBoundingClientRect();
 const computed=getComputedStyle(dog),firstTransform=computed.transform,firstOpacity=computed.opacity;
 [dog,ground].forEach(el=>el.getAnimations().forEach(a=>a.cancel()));
 if(entranceOrigin.mode==='tracking'){
 dog.animate([{transform:firstTransform,opacity:firstOpacity},{transform:'translateY(-8px) scale(.85)',opacity:0}],{duration:200,fill:'forwards'});
 ground.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});return;
 }
 const cx=stage.left+dog.offsetLeft+dog.offsetWidth/2,cy=stage.top+dog.offsetTop+dog.offsetHeight*.92;
 const x=(entranceOrigin.x??cx)-cx,y=(entranceOrigin.y??cy)-cy;
 if(!entranceOrigin.reduceMotion&&!window.matchMedia('(prefers-reduced-motion:reduce)').matches){
 dog.animate([
 {transform:firstTransform==='none'?'translate(0,0) scale(1)':firstTransform,opacity:firstOpacity},
 {transform:'translate(0,5px) scale(1.11,.87) rotate(-3deg)',offset:.18,opacity:1},
 {transform:`translate(${x*.28}px,-32px) scale(.88,1.06) rotate(10deg)`,offset:.48,opacity:1},
 {transform:`translate(${x*.76}px,${y*.45-12}px) scale(.38,.55) rotate(17deg)`,offset:.78,opacity:1},
 {transform:`translate(${x}px,${y+12}px) scale(.02,.01) rotate(20deg)`,offset:1,opacity:0}
 ],{duration:700,easing:'cubic-bezier(.35,0,.55,1)',fill:'forwards'});
 ground.animate([{opacity:1,transform:'scaleX(1)'},{opacity:0,transform:'scaleX(0)'}],{duration:350,delay:380,fill:'forwards'});
 }
};
function dismiss(){
 if(document.body.classList.contains('departing')||document.body.classList.contains('dismissed'))return;
 if(native){window.webkit.messageHandlers.dog.postMessage({action:'dismiss'});return}
 const sequence=++presentSequence;departMochi();
 const reduced=entranceOrigin.reduceMotion||window.matchMedia('(prefers-reduced-motion:reduce)').matches;
 departureTimer=setTimeout(()=>{if(sequence===presentSequence)document.body.classList.add('dismissed')},reduced?0:780);
}
function send(action){
 if(native){window.webkit.messageHandlers.dog.postMessage(action);return}
 if(action.action==='snapshot'||action.action==='refresh'){
 fetch('/snapshot').then(r=>r.json()).then(data=>receive({type:'snapshot',...data})).catch(()=>{$('status').textContent='Open Mochi to connect your projects.'});
 }else if(['ask','replyQuestion','askApproval','decideApproval','startTask','sendTurn','stopTask','addWork','addChecklist','setChecklistDone','retryWork'].includes(action.action)){
 fetch(action.action==='ask'?'/ask':action.action==='replyQuestion'?'/reply':'/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(action)}).then(r=>r.json()).then(data=>receive({type:'answer',...action,...data})).catch(()=>receive({type:'answer',...action,error:'Connection unavailable. Reopen Mochi to reconnect.'}));
 }
}
function current(){return items.find(x=>x.id===selected)}
function directQuestion(){return current()?.questions?.find(q=>q.canReply&&q.source!=='checklist')||current()?.questions?.find(q=>q.canReply)}
function focusedApproval(){return current()?.approvals?.find(a=>a.canDecide&&a.id===approvalFocus.get(selected))}
function control(action,extra={}){
 if(controlBusy.has(selected))return;
 const id=String(++nextId);controlBusy.add(selected);pending.set(id,{selection:selected,direct:true,control:true,action,text:''});render();
 send({action,selection:selected,requestId:id,operationId:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2),...extra});
}

function revealAnswer(key){
 if(!items.some(i=>i.id===key))return;
 selectProject(key);focusId=key;focusTaskKey=recommendationKey;
 send({action:'select',selection:key,autoFollow,keepConversation:true});render();syncEditing();
 if(!native)presentMochi({placement:'topRight',x:65,y:158});
}
function busy(){return [...pending.values()].some(p=>p.selection===selected)}
function editing(){return !!$('question').value.trim()||busy()}
function syncEditing(){send({action:'editing',editing:editing()})}
function selectProject(id){
 if(id!==selected){drafts.set(selected,$('question').value);selected=id;composeMode='ask';$('question').value=drafts.get(id)||'';syncEditing()}
 $('project').value=selected;
}
function redrawMessages(){
 const list=[...(conversations.get(selected)||[]),...(current()?.managedCodex?(current().activity?.notes||[]).map(text=>({role:'codex',text})):[])];$('messages').replaceChildren();
 if(!list.length){const d=document.createElement('div');d.className='empty';d.textContent=directQuestion()?(directQuestion().source==='checklist'?'Choose whether this is the same task or new work.':'Codex is waiting. Your reply below goes back to the run that asked.'):'Ask what’s been done — I can answer from the latest project updates.';$('messages').append(d)}
 for(const item of list){const d=document.createElement('div');d.className='msg '+(item.role==='user'?'user':'mochi');const label=document.createElement('span');label.className='who';label.textContent=item.role==='user'?'You':item.role==='codex'?'Codex connection':'Mochi';d.append(label,document.createTextNode(item.text));$('messages').append(d)}
 $('send').disabled=busy();
 if(busy()){const d=document.createElement('div');d.className='empty';d.textContent='Mochi is checking…';$('messages').append(d)}
 $('messages').scrollTop=$('messages').scrollHeight;
}
function renderChecklist(item){
 const c=item.checklist||{},tasks=c.tasks||[];
 $('checklistCount').textContent=`${tasks.filter(t=>t.done).length} / ${tasks.length}`;
 const key=JSON.stringify([item.id,c.revision,tasks,controlBusy.has(selected)]);
 if($('checklistList').dataset.state!==key){
 $('checklistList').dataset.state=key;$('checklistList').replaceChildren();
 for(const task of tasks){const label=document.createElement('label');label.className='checklist-row'+(task.done?' done':'');
 const box=document.createElement('input');box.type='checkbox';box.checked=task.done;box.disabled=controlBusy.has(selected);box.setAttribute('aria-label',task.title);
 box.onchange=()=>control('setChecklistDone',{taskId:task.id,done:box.checked,revision:c.revision});
 const text=document.createElement('span');text.textContent=task.title;if(task.evidence?.quote)text.title=task.evidence.kind+': '+task.evidence.quote;
 label.append(box,text);$('checklistList').append(label)}
 if(!tasks.length){const text=document.createElement('div');text.className='empty';text.textContent='I’ll build this from your chat and Codex plans. You can add a task too.';$('checklistList').append(text)}
 }
 const deliveries=(c.deliveries||[]).map(d=>`${d.title}: ${d.status==='notSent'?'saved, prompt not sent':d.status==='uncertain'||d.status==='sending'?'check Codex before resending':'ready to send'}${d.error?' · '+d.error:''}`);
 $('savedWork').replaceChildren();for(const d of c.deliveries||[]){if(d.status==='notSent'){const b=document.createElement('button');b.textContent='Send saved task: '+d.title;b.disabled=controlBusy.has(selected);b.onclick=()=>control('retryWork',{proposalId:d.id});$('savedWork').append(b)}}
 $('checklistNote').textContent=[c.syncing?'Reading chat history…':c.issue||'Syncs from chat and recorded plans. You can edit the boxes.',...deliveries].join('\n');
}
function render(){
 const item=current();if(!item)return;
 const p=item.progress||{},approvals=item.approvals||[],questions=item.questions||[],a=focusedApproval(),q=a?null:directQuestion();
 renderChecklist(item);
 $('greeting').textContent=q?.source==='checklist'?'Is this the same task, or something new?':questions.length?'Codex has a question for you.':approvals.length?'Codex needs your approval.':p.source==='plan'?'I’m following Codex’s current task plan.':item.status==='active'?'I’m tracking the progress.':p.total&&p.completed===p.total?'All paws up — your checklist is finished!':p.issue?'I’m watching the latest project updates.':'One paw at a time. Here’s our progress.';
 $('percent').textContent=p.percent==null?'—':p.percent+'%';$('ring').style.setProperty('--sweep',((p.percent||0)*3.6)+'deg');
 $('count').textContent=p.issue?'Activity tracking':`${p.completed} of ${p.total} tasks complete`;
 $('remaining').textContent=p.issue?'A percentage appears when Codex records a task plan':p.source==='plan'?'Current task plan · '+(p.total-p.completed)+' remaining':p.total?`${p.total-p.completed} remaining`:'No tasks yet';
 const activity=questions.length?'Waiting for your reply':item.status==='active'?'Working now':item.status==='waitingOnApproval'?'Approval requested':item.status==='idle'?'Latest turn finished':'Recent project';
 $('status').textContent=(autoFollow?'Auto-follow · ':'Pinned · ')+activity+' · '+(item.managedCodex?(item.status==='disconnected'?'Codex task disconnected':'Live Codex task connection'):item.mochiConnected?'Mochi ↔ Codex connected':item.activity?.observed?'Local activity connected':item.hookConnected?'Codex alerts connected':'Local project');
 $('follow').textContent=autoFollow?'Auto ✓':'Auto';$('follow').setAttribute('aria-pressed',String(autoFollow));
 const attentionKey=JSON.stringify([selected,questions.map(q=>q.id),approvals.map(a=>a.id)]);if($('checklistPanel').dataset.attention!==attentionKey){$('checklistPanel').dataset.attention=attentionKey;if(questions.length||approvals.length)$('checklistPanel').open=false;}
 document.body.classList.toggle('has-attention',!!questions.length||!!approvals.length);$('attention').hidden=!questions.length&&!approvals.length;$('attentionTitle').textContent=questions.length&&approvals.length?'Codex needs your input and approval':q?.source==='checklist'?'Mochi is asking':questions.length?'Codex is asking':approvals.some(a=>a.canDecide)?'Codex needs your permission':'Permission requested in Codex';
 $('attentionText').textContent=[...approvals.filter(a=>!a.canDecide).map(a=>'Permission: '+a.reason),...(q?[q]:questions.filter(x=>!x.canReply)).map(x=>x.question)].join('\n\n');
 $('review').hidden=!approvals.some(a=>!a.canDecide)&&!questions.some(x=>!x.canReply);$('review').textContent=approvals.length?'Review in Codex ↗':'Open Codex to reply ↗';$('review').disabled=!item.threadId;$('options').replaceChildren();
 const cardKey=JSON.stringify([selected,approvals.filter(a=>a.canDecide),controlBusy.has(selected)]);
 if($('approvalCards')?.dataset.state!==cardKey){$('approvalCards')?.remove();const cards=document.createElement('div');cards.id='approvalCards';cards.dataset.state=cardKey;
 for(const approval of approvals.filter(a=>a.canDecide)){
 const card=document.createElement('section');card.className='approval-card';
 const reason=document.createElement('p');reason.textContent=approval.reason;card.append(reason);
 const details=document.createElement('pre');details.textContent=approval.details||'';card.append(details);
 const note=document.createElement('p');note.className='scope-note';note.textContent=approval.source==='permissionHook'?'Replies directly to this waiting Codex request. No always-allow rule is added.':approval.kind==='permissions'?'Allow grants only the displayed access for this turn.':'Decision applies to this request; no always-allow rule is added.';card.append(note);
 const actions=document.createElement('div');actions.className='actions';
 for(const decision of approval.decisions||[]){const b=document.createElement('button');b.type='button';b.textContent=decision==='allow'?'Allow once':'Deny';b.className=decision==='deny'?'deny':'';b.disabled=controlBusy.has(selected);b.onclick=()=>control('decideApproval',{approvalId:approval.id,decision});actions.append(b)}
 const ask=document.createElement('button');ask.type='button';ask.textContent='Ask about this request';ask.onclick=()=>{approvalFocus.set(selected,approval.id);composeMode='ask';render();$('question').focus()};actions.append(ask);card.append(actions);cards.append(card);
 }$('attention').insertBefore(cards,$('options'));}
 $('requestMode').hidden=!a;$('requestMode').textContent=a?'Discussing this permission · it stays pending until you choose a button.':'';
 const active=['active','starting','waitingOnApproval','waitingOnInput'].includes(item.status);
 $('newTask').disabled=busy();$('newTask').setAttribute('aria-pressed',String(composeMode==='startTask'));
 $('continueTask').hidden=!item.managedCodex;$('continueTask').disabled=busy();$('continueTask').setAttribute('aria-pressed',String(composeMode==='addWork'));
 $('stopTask').hidden=!item.managedCodex||!active;$('stopTask').disabled=controlBusy.has(selected);
 $('askMode').hidden=composeMode==='ask'&&!a;
 $('taskHint').hidden=composeMode==='ask';$('taskHint').textContent=composeMode==='startTask'?'Starts a separate Codex chat in this project. Its approvals return here.':composeMode==='addChecklist'?'Adds an item to this project checklist. Similar tasks need your choice.':'Adds a checklist item and sends your instructions to this Codex chat. Answer pending questions or permissions first.';
 if(q){for(const option of q.options||[]){const b=document.createElement('button');b.type='button';b.textContent=option;b.onclick=()=>submit(option);$('options').append(b)}}
 $('question').placeholder=a?'Ask why this access is needed…':q?(q.source==='checklist'?'Choose Same task or Different task above…':'Reply to Codex…'):composeMode==='startTask'?'Describe the task for Codex…':composeMode==='addWork'?'Describe the additional work…':composeMode==='addChecklist'?'What needs to be done?':'Ask Mochi about this project…';$('question').setAttribute('aria-label',q?(q.source==='checklist'?'Reply to Mochi':'Reply to Codex'):'Ask Mochi a question');$('send').textContent=a?'Ask ↑':q?'Reply ↑':composeMode==='startTask'?'Start task ↑':composeMode==='addWork'?'Add work ↑':composeMode==='addChecklist'?'Add task ↑':'Ask ↑';$('open').disabled=!item.threadId;document.querySelector('.chips').hidden=!!q;redrawMessages();
}
window.receive=function(data){
 if(data.type==='snapshot'){
 items=data.items||[];if(typeof data.autoFollow==='boolean')autoFollow=data.autoFollow;
 const recommendation=items.find(i=>i.id===(data.autoSelection||data.selection));recommendationKey=recommendation?.trackingKey||recommendation?.id||'';
 const taskKeys=items.map(i=>i.trackingKey).filter(Boolean);if(knownTasks.size&&taskKeys.some(k=>!knownTasks.has(k))){focusId='';focusTaskKey=''}taskKeys.forEach(k=>knownTasks.add(k));
 const preferred=data.attentionSelection||(autoFollow&&!editing()&&!directQuestion()?(focusId||data.autoSelection||data.selection):selected);
 const next=items.some(x=>x.id===preferred)?preferred:items.some(x=>x.id===selected)?selected:(items[0]?.id||'');
 const keys=items.map(i=>i.id+'|'+i.title+'|'+i.status).join('\n');
 if($('project').dataset.keys!==keys){$('project').replaceChildren(...items.map(i=>{const o=document.createElement('option');o.value=i.id;o.textContent=((i.approvals?.length||i.questions?.length)?'⚑ ':i.status==='active'?'● ':'')+i.title;return o}));$('project').dataset.keys=keys}
 selectProject(next);render();
 }else if(data.type==='showAnswer'){
 revealAnswer(data.selection);
 }else if(data.type==='answer'){
 const returnWhenReady=!native&&(document.body.classList.contains('departing')||document.body.classList.contains('dismissed'));
 const entry=pending.get(String(data.requestId));pending.delete(String(data.requestId));if(entry?.control)controlBusy.delete(entry.selection);
 const key=data.routedSelection||entry?.selection||data.selection;
 if(!data.error&&entry?.action==='startTask'&&key&&!items.some(i=>i.id===key)){items.push({id:key,threadId:key,title:'Codex task',cwd:current()?.cwd,status:'starting',managedCodex:true,questions:[],approvals:[],progress:{issue:'Connecting'}})}
 if(entry?.control&&!data.error){composeMode='ask';send({action:'snapshot'})}else if(entry?.direct&&!data.error){send({action:'snapshot'})}

 if(key&&entry?.action!=='setChecklistDone'){const list=conversations.get(key)||[];
 if(entry&&!entry.control&&key!==entry.selection){const old=conversations.get(entry.selection)||[];const idx=old.findLastIndex?old.findLastIndex(x=>x.role==='user'&&x.text===entry.text):-1;if(idx>=0)old.splice(idx,1);list.push({role:'user',text:entry.text})}
 list.push({role:entry?.direct&&!['addChecklist','setChecklistDone','replyQuestion'].includes(entry?.action)?'codex':'mochi',text:data.error||data.text||'I couldn’t get a reply.'});conversations.set(key,list)}
 if(key&&data.routedSelection&&selected===entry?.selection&&!$('question').value.trim()){selectProject(key);if(autoFollow&&!entry.direct){focusId=key;focusTaskKey=recommendationKey}send({action:'select',selection:key,autoFollow,keepConversation:!entry.direct});}
 render();syncEditing();
 if(returnWhenReady&&entry&&!entry.direct&&key)revealAnswer(key);
 }else if(data.type==='error'){$('status').textContent=data.error}
};
function submit(text,forceAsk=false){
 if(!selected||busy()||!text.trim())return;
 const a=forceAsk?null:focusedApproval();
 if(!forceAsk&&!a&&composeMode!=='ask'&&!directQuestion()){const taskText=text.trim();$('question').value='';drafts.set(selected,'');control(composeMode,{text:taskText});return}
 const id=String(++nextId),list=conversations.get(selected)||[],q=forceAsk||a?null:directQuestion();
 list.push({role:'user',text:text.trim()});conversations.set(selected,list);pending.set(id,{selection:selected,direct:!!q,text:text.trim()});$('question').value='';drafts.set(selected,'');redrawMessages();syncEditing();
 send({action:a?'askApproval':q?'replyQuestion':'ask',selection:selected,autoFollow,approvalId:a?.id,questionId:q?.id,text:text.trim(),requestId:id});
}
$('newTask').onclick=()=>{composeMode='startTask';approvalFocus.delete(selected);render();$('question').focus()};
$('continueTask').onclick=()=>{composeMode='addWork';approvalFocus.delete(selected);render();$('question').focus()};
$('checklistPanel').addEventListener('toggle',()=>document.body.classList.toggle('checklist-open',$('checklistPanel').open));
$('addChecklist').onclick=()=>{composeMode='addChecklist';approvalFocus.delete(selected);render();$('question').focus()};
$('askMode').onclick=()=>{composeMode='ask';approvalFocus.delete(selected);render()};
$('stopTask').onclick=()=>control('stopTask');
$('composer').addEventListener('submit',e=>{e.preventDefault();submit($('question').value)});
$('question').addEventListener('input',syncEditing);
$('question').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit($('question').value)}});
document.querySelectorAll('[data-question]').forEach(b=>b.addEventListener('click',()=>submit(b.dataset.question,true)));
$('project').addEventListener('change',()=>{autoFollow=false;focusId='';focusTaskKey='';selectProject($('project').value);send({action:'select',selection:selected,autoFollow});syncEditing();render()});
$('follow').onclick=()=>{autoFollow=!autoFollow;focusId='';focusTaskKey='';send({action:'follow',autoFollow});send({action:'snapshot'});render()};
$('refresh').onclick=()=>send({action:'refresh'});$('close').onclick=dismiss;
document.addEventListener('keydown',e=>{if(e.key==='Escape')dismiss()});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('button,input,label,summary,select,textarea,a,.conversation,.speech,.attention,.picker,.checklist-panel'))dismiss()});
function openThread(){const item=current();if(item?.threadId)send({action:'openThread',threadId:item.threadId})}
$('open').onclick=openThread;$('review').onclick=openThread;$('replay').onclick=()=>presentMochi();
$('trackingDemo').onclick=()=>{presentMochi({mode:'tracking',placement:'topRight',projectTitle:current()?.title});const sequence=presentSequence;departureTimer=setTimeout(()=>{if(sequence===presentSequence){departMochi();departureTimer=setTimeout(()=>{if(sequence===presentSequence)document.body.classList.add('dismissed')},200)}},1300)};
if(!native)presentMochi();send({action:'ready'});
if(!native){send({action:'snapshot'});setInterval(()=>send({action:'snapshot'}),2000)}
</script></body></html>
